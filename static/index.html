<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fridge to Recipe</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen">
  <main class="max-w-4xl mx-auto px-4 py-10">
    <header class="text-center mb-8">
      <h1 class="text-3xl font-bold">🧊 Fridge to Recipe</h1>
      <p class="text-stone-500 mt-1">Upload a photo of your fridge and get 5 recipes you can make.</p>
    </header>

    <!-- Upload -->
    <label id="dropzone" for="file"
           class="block border-2 border-dashed border-stone-300 rounded-xl bg-white p-8 text-center cursor-pointer hover:border-emerald-500 transition">
      <input id="file" type="file" accept="image/*" class="hidden">
      <p class="font-medium">Click to choose a photo, or drag one here</p>
      <p class="text-sm text-stone-400 mt-1">JPG, PNG or WebP · up to 10 MB</p>
    </label>

    <div id="error" class="hidden mt-4 rounded-lg bg-red-50 border border-red-200 text-red-700 px-4 py-3"></div>

    <!-- Preview + detections -->
    <section id="analysis" class="hidden mt-8 grid md:grid-cols-2 gap-6">
      <img id="preview" alt="Your fridge" class="rounded-xl shadow w-full object-cover max-h-80 bg-stone-200">
      <div>
        <h2 class="font-semibold mb-3">Detected items</h2>
        <div id="loading" class="hidden text-stone-500">Analyzing your fridge…</div>
        <div id="badges" class="flex flex-wrap gap-2"></div>
        <p id="no-items" class="hidden text-stone-500">No food items detected. Try a clearer or closer photo.</p>
      </div>
    </section>

    <!-- Recipes -->
    <section id="recipes-section" class="hidden mt-10">
      <h2 class="text-xl font-semibold mb-4">Top 5 recipes</h2>
      <div id="recipes" class="space-y-4"></div>
    </section>
  </main>

<script>
const $ = (id) => document.getElementById(id);
const MAX_BYTES = 10 * 1024 * 1024;

// Build DOM with textContent only: recipe text comes from a third-party dataset.
function el(tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined) e.textContent = text;
  return e;
}

function showError(msg) {
  const box = $("error");
  box.textContent = msg;
  box.classList.toggle("hidden", !msg);
}

function renderBadges(detected) {
  const box = $("badges");
  box.replaceChildren();
  $("no-items").classList.toggle("hidden", detected.length > 0);
  for (const d of detected) {
    const b = el("span", "inline-flex items-center gap-2 rounded-full bg-emerald-100 text-emerald-800 px-3 py-1 text-sm font-medium capitalize");
    b.append(d.name, el("span", "text-xs text-emerald-600 font-normal", Math.round(d.confidence * 100) + "%"));
    box.append(b);
  }
}

function chips(items, cls, emptyText) {
  const wrap = el("div", "flex flex-wrap gap-1.5");
  if (!items.length) wrap.append(el("span", "text-sm text-stone-400", emptyText));
  for (const i of items) wrap.append(el("span", `rounded-md px-2 py-0.5 text-sm ${cls}`, i));
  return wrap;
}

function renderRecipes(recipes) {
  const list = $("recipes");
  list.replaceChildren();
  $("recipes-section").classList.toggle("hidden", recipes.length === 0);
  recipes.forEach((r, idx) => {
    const card = el("article", "bg-white rounded-xl shadow-sm border border-stone-200 p-5");

    const head = el("div", "flex items-start justify-between gap-3");
    head.append(el("h3", "text-lg font-semibold", `${idx + 1}. ${r.title}`));
    const n = r.matched_count;
    head.append(el("span", "shrink-0 rounded-full bg-emerald-600 text-white text-sm px-3 py-1",
      `Matches ${n} detected item${n === 1 ? "" : "s"}`));
    card.append(head);

    const grid = el("div", "grid sm:grid-cols-2 gap-4 mt-4");
    const have = el("div");
    have.append(el("p", "text-xs uppercase tracking-wide text-stone-400 mb-1", "You have"));
    have.append(chips(r.matched_ingredients, "bg-emerald-50 text-emerald-700", "—"));
    const need = el("div");
    need.append(el("p", "text-xs uppercase tracking-wide text-stone-400 mb-1", `Missing (${r.missing_count})`));
    need.append(chips(r.missing_ingredients, "bg-amber-50 text-amber-700 capitalize", "Nothing — you have it all!"));
    grid.append(have, need);
    card.append(grid);

    const details = el("details", "mt-4");
    details.append(el("summary", "cursor-pointer text-sm font-medium text-emerald-700", "Cooking instructions"));
    details.append(el("p", "mt-2 text-sm text-stone-600 whitespace-pre-line leading-relaxed", r.instructions));
    card.append(details);

    list.append(card);
  });
}

async function analyze(file) {
  showError("");
  if (!file.type.startsWith("image/")) return showError("Please choose an image file.");
  if (file.size > MAX_BYTES) return showError("Image is too large (max 10 MB).");

  $("preview").src = URL.createObjectURL(file);
  $("analysis").classList.remove("hidden");
  $("loading").classList.remove("hidden");
  $("badges").replaceChildren();
  $("no-items").classList.add("hidden");
  $("recipes-section").classList.add("hidden");

  try {
    const form = new FormData();
    form.append("file", file);
    const res = await fetch("/api/analyze-fridge", { method: "POST", body: form });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || `Request failed (${res.status})`);
    }
    const data = await res.json();
    renderBadges(data.detected);
    renderRecipes(data.recipes);
  } catch (err) {
    showError(err.message);
    $("analysis").classList.add("hidden");
  } finally {
    $("loading").classList.add("hidden");
  }
}

$("file").addEventListener("change", (e) => e.target.files[0] && analyze(e.target.files[0]));
const dz = $("dropzone");
["dragenter", "dragover"].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add("border-emerald-500"); }));
["dragleave", "drop"].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove("border-emerald-500"); }));
dz.addEventListener("drop", (e) => e.dataTransfer.files[0] && analyze(e.dataTransfer.files[0]));
</script>
</body>
</html>
